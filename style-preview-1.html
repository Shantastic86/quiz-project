<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Style 1: Playful & Colorful</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #FFD93D, #FF6B9D, #6BCB77, #4D96FF);
    background-size: 300% 300%;
    animation: gradientShift 8s ease infinite;
    padding: 2rem;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: white;
    border-radius: 32px;
    padding: 3rem 2.5rem;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    text-align: center;
  }
  .label {
    display: inline-block;
    background: #FF6B9D;
    color: white;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    padding: 0.4rem 1rem;
    border-radius: 100px;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.9rem;
    color: #2d2d2d;
    margin-bottom: 2rem;
    line-height: 1.3;
  }
  .options { display: flex; flex-direction: column; gap: 0.9rem; }
  .option {
    background: #FFF4E0;
    border: 3px solid transparent;
    border-radius: 20px;
    padding: 1rem 1.3rem;
    font-weight: 700;
    font-size: 1.05rem;
    color: #2d2d2d;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  .option:hover { transform: scale(1.03) rotate(-1deg); border-color: #4D96FF; }
  .option .emoji { font-size: 1.4rem; }
</style>
</head>
<body>
  <div class="card">
    <span class="label">Question 3 of 6</span>
    <h1>🎬 What's your ideal Friday night?</h1>
    <div class="options">
      <div class="option"><span class="emoji">🎉</span> Out dancing until 2am</div>
      <div class="option"><span class="emoji">🍿</span> Movie marathon with snacks</div>
      <div class="option"><span class="emoji">🧘</span> Quiet night, book in hand</div>
      <div class="option"><span class="emoji">🍰</span> Baking something sweet</div>
    </div>
  </div>
</body>
</html>
