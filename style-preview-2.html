<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Style 2: Minimal & Clean</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    padding: 2rem;
  }
  .card {
    max-width: 460px;
    width: 100%;
    text-align: left;
  }
  .progress {
    width: 100%;
    height: 3px;
    background: #eaeaea;
    border-radius: 100px;
    margin-bottom: 2.5rem;
    overflow: hidden;
  }
  .progress-fill {
    width: 50%;
    height: 100%;
    background: #111;
  }
  .label {
    font-size: 0.8rem;
    font-weight: 500;
    color: #999;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: block;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    color: #111;
    margin-bottom: 2.5rem;
    line-height: 1.35;
  }
  .options { display: flex; flex-direction: column; gap: 0.75rem; }
  .option {
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 1.1rem 1.25rem;
    font-weight: 500;
    font-size: 1rem;
    color: #333;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover { border-color: #111; background: #f5f5f5; }
</style>
</head>
<body>
  <div class="card">
    <div class="progress"><div class="progress-fill"></div></div>
    <span class="label">Question 3 of 6</span>
    <h1>What's your ideal Friday night?</h1>
    <div class="options">
      <div class="option">Out dancing until 2am</div>
      <div class="option">Movie marathon with snacks</div>
      <div class="option">Quiet night, book in hand</div>
      <div class="option">Baking something sweet</div>
    </div>
  </div>
</body>
</html>
